name: 功能建议
description: 分享希望 Solaris 改善的使用场景或工作方式
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助 Solaris 变得更好。

        请优先描述你遇到的工作场景和困难，不必先设计完整解决方案。
        请勿提交工作区文件、诊断日志、个人信息、公司机密、客户数据或其他敏感内容。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这项改进？
      placeholder: 例如：每周回顾多个项目时，我希望……
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前困难
      description: 现在需要怎样绕行，或者哪里容易中断？
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 如果这项改进完成，你希望工作方式发生什么变化？
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 已尝试的方法（可选）
      description: 可以填写你目前使用的替代方式。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本建议不包含工作区、诊断日志、个人信息、公司机密或其他敏感内容。
          required: true

