name: Bug 反馈
description: 反馈可以稳定复现的 Solaris 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 Solaris 问题。

        请勿提交工作区文件、诊断日志、个人信息、公司机密、客户数据或其他敏感内容。

  - type: input
    id: version
    attributes:
      label: Solaris 版本
      description: 可在应用信息或下载页面查看
      placeholder: 例如 v1.0.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.7.7
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Mac 型号或芯片
      placeholder: 例如 MacBook Pro，Apple M 系列
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不包含私人或业务数据的示例描述
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本反馈不包含工作区、诊断日志、个人信息、公司机密或其他敏感内容。
          required: true
